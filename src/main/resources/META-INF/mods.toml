modLoader="javafml"
loaderVersion="${loader_version_range}"
license="${mod_license}"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="${mod_name}"
authors="${mod_authors}"
description='''${mod_description}'''

[modproperties.${mod_id}]
# Optional: background texture for this mod's Configured config screen (see the
# In-game config editing section of README.md). Any existing texture works.
configuredBackground = "minecraft:textures/block/stone.png"

[[dependencies.${mod_id}]]
modId="forge"
mandatory=true
versionRange="${forge_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
mandatory=true
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"

# Optional integration targets - presence-only gates: each compat class
# checks ModList before touching the target, so absence no-ops. Floors are
# "[0,)" because no API surface is pinned (Forge-era schema: mandatory=false).
[[dependencies.${mod_id}]]
modId="apotheosis"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="ars_nouveau"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="irons_spellbooks"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"

[[dependencies.${mod_id}]]
modId="legendarysurvivaloverhaul"
mandatory=false
versionRange="[0,)"
ordering="AFTER"
side="BOTH"
