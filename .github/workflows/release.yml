name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write
  # Needed to dispatch the CurseForge workflow. See the final step for why the
  # release: published event alone is not enough.
  actions: write

# Serialize releases. Two rapid pushes must queue rather than race for the
# same tag, and a cancelled release is worse than a late one.
concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release:
    name: build-tag-release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history is mandatory, not a nicety. Without it the changelog
          # range has nothing to walk and silently produces an empty release
          # body - the worst possible failure mode, because it succeeds.
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      # Annotated tags record who created them, and a runner ships with no git
      # identity. Without this, `git tag -a` aborts with "empty ident name not
      # allowed" (exit 128) after the build has already passed.
      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Determine release channel
        id: channel
        env:
          ALPHA_RELEASES: ${{ vars.ALPHA_RELEASES }}
        run: |
          set -euo pipefail

          NEW_VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          OLD_VERSION=$(git show HEAD~1:gradle.properties | grep '^mod_version=' | cut -d= -f2 | tr -d '[:space:]')
          SHORT_SHA=$(git rev-parse --short=7 HEAD)

          echo "mod_version: $OLD_VERSION -> $NEW_VERSION"
          echo "commit: $SHORT_SHA"

          if [ "$NEW_VERSION" = "$OLD_VERSION" ]; then
            CHANNEL="alpha"
            REASON="no version bump since the previous commit"
            TAG="v${NEW_VERSION}+g${SHORT_SHA}"
          else
            case "$NEW_VERSION" in
              *-alpha*|*-Alpha*|*-ALPHA*)
                CHANNEL="alpha"
                REASON="version bumped with an -alpha pre-release suffix"
                TAG="v${NEW_VERSION}+g${SHORT_SHA}"
                ;;
              *-*)
                CHANNEL="beta"
                REASON="version bumped with a pre-release suffix"
                TAG="v${NEW_VERSION}"
                ;;
              *)
                CHANNEL="stable"
                REASON="version bumped with no pre-release suffix"
                TAG="v${NEW_VERSION}"
                ;;
            esac

            # Defense in depth. CI rejects an isolated-beta-or-stable bump that
            # carries other changes, but if that ever slips through - an admin
            # bypass, checks not yet required - publishing an ambiguous stable
            # release is exactly the failure this rule exists to prevent.
            if [ "$CHANNEL" != "alpha" ]; then
              EXTRA=$(git show --name-only --format= HEAD | grep -v '^gradle\.properties$' | grep -v '^$' || true)
              if [ -n "$EXTRA" ]; then
                echo "::error::Refusing to publish a $CHANNEL release."
                echo "::error::A $CHANNEL bump must be an isolated version bump, but this commit also changed:"
                echo "$EXTRA"
                echo "::error::This should have been blocked by the version-bump CI check."
                exit 1
              fi
            fi
          fi

          echo "channel: $CHANNEL ($REASON)"
          echo "tag: $TAG"

          # Automatic alpha releases are opt-in. The alpha channel fires on any
          # push to main that did not bump the version, so with no switch it
          # tags and publishes a build for every commit - noise nobody asked
          # for, and awkward to unwind once those tags are in the wild.
          #
          # Deliberately read as a repository variable rather than a workflow
          # default so it can be flipped without editing this file. Unset counts
          # as off: silence is the safer failure mode. Forgetting to switch it
          # on costs one missing nightly; forgetting to switch it off costs an
          # unwanted published release and a tag to clean up.
          #
          # This gates the release only, never the build. The tests below are
          # the sole verification main receives after a merge - CI runs on the
          # pull request, not on the merge - so they keep running whether or not
          # anything gets published.
          ALPHA_ON=$(printf '%s' "${ALPHA_RELEASES:-}" | tr '[:upper:]' '[:lower:]')
          case "$ALPHA_ON" in
            true|1|yes|on) ALPHA_ON="true" ;;
            *)             ALPHA_ON="false" ;;
          esac

          if [ "$CHANNEL" = "alpha" ] && [ "$ALPHA_ON" != "true" ]; then
            RELEASE="false"
            echo "::notice::Skipping the $CHANNEL release for $TAG. Set the ALPHA_RELEASES repository variable to true to publish alphas again."
          else
            RELEASE="true"
          fi

          # Alphas never reach CurseForge. This mirrors the skip inside the
          # CurseForge workflow so the decision is made in one place, before
          # anything is dispatched.
          if [ "$CHANNEL" = "alpha" ]; then PUBLISH="false"; else PUBLISH="true"; fi

          {
            echo "channel=$CHANNEL"
            echo "tag=$TAG"
            echo "version=$NEW_VERSION"
            echo "publish=$PUBLISH"
            echo "release=$RELEASE"
          } >> "$GITHUB_OUTPUT"

      - name: Build and run JUnit suite
        run: ./gradlew build --no-daemon --stacktrace

      - name: Assert the JUnit suite actually ran
        run: |
          if [ ! -d build/test-results/test ]; then
            echo "::error::Refusing to release: no test results directory. :test was NO-SOURCE."
            exit 1
          fi
          TOTAL=$(grep -ho 'tests="[0-9]*"' build/test-results/test/TEST-*.xml 2>/dev/null \
                  | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          FAILED=$(grep -ho 'failures="[0-9]*"' build/test-results/test/TEST-*.xml 2>/dev/null \
                   | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          ERRORED=$(grep -ho 'errors="[0-9]*"' build/test-results/test/TEST-*.xml 2>/dev/null \
                    | grep -o '[0-9]*' | awk '{s+=$1} END {print s+0}')
          echo "tests=$TOTAL failures=$FAILED errors=$ERRORED"
          if [ "$TOTAL" -le 0 ]; then
            echo "::error::Refusing to release: the JUnit suite ran 0 tests."
            exit 1
          fi
          if [ "$FAILED" -gt 0 ] || [ "$ERRORED" -gt 0 ]; then
            echo "::error::Refusing to release: JUnit reported $FAILED failures and $ERRORED errors."
            exit 1
          fi

      - name: Run GameTest server
        run: |
          set +e
          ./gradlew runGameTestServer --no-daemon 2>&1 | tee gametest.log
          echo "gradle exit code: $?" >> gametest.log

      - name: Assert GameTests ran and passed
        run: |
          LINE=$(grep -E "All [0-9]+ required tests passed" gametest.log || true)
          if [ -z "$LINE" ]; then
            echo "::error::Refusing to release: GameTest run never reported a result."
            echo "--- last 120 lines ---"
            tail -120 gametest.log
            exit 1
          fi
          COUNT=$(echo "$LINE" | sed -E 's/.*All ([0-9]+) required tests passed.*/\1/')
          echo "reported: $LINE"
          if [ "$COUNT" -le 0 ]; then
            echo "::error::Refusing to release: GameTest server ran 0 tests."
            exit 1
          fi

      - name: Generate changelog
        id: changelog
        if: steps.channel.outputs.release == 'true'
        env:
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail

          # Baselines differ by channel, which is what makes a stable release
          # cumulative. Alphas span the latest tag of any kind. Betas and
          # stables span the last STABLE tag, so v0.2.0 re-lists everything
          # back through the intervening betas rather than only the last one.
          if [ "$CHANNEL" = "alpha" ]; then
            BASELINE=$(git tag --list 'v*' --sort=-creatordate | head -1 || true)
          else
            BASELINE=$(git tag --list 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -1 || true)
          fi

          if [ -z "$BASELINE" ]; then
            echo "no baseline tag; changelog spans the full history"
            BODY="Initial release."
            BODY+=$'\n\n'
            BODY+=$(git log --pretty=format:"- %s" HEAD)
          else
            echo "changelog baseline: $BASELINE"
            COMMITS=$(git log --pretty=format:"- %s" "${BASELINE}..HEAD" || true)
            if [ -z "$COMMITS" ]; then
              BODY="No user-facing changes since ${BASELINE}."
            else
              BODY="Changes since ${BASELINE}:"
              BODY+=$'\n\n'
              BODY+="$COMMITS"
            fi
          fi

          {
            echo "body<<EOF"
            echo "$BODY"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "--- changelog ---"
          echo "$BODY"

      - name: Create or update annotated tag
        if: steps.channel.outputs.release == 'true'
        env:
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          set -euo pipefail

          # Write the changelog to a file rather than passing it on the command
          # line. Shell quoting of multi-line text is fragile and a failure here
          # would silently truncate the tag message.
          cat > tag-message.md <<EOF
          ${{ steps.changelog.outputs.body }}
          EOF

          if git ls-remote --exit-code --tags origin "refs/tags/$TAG" > /dev/null 2>&1; then
            echo "Tag $TAG already exists; force-updating so a re-run is idempotent."
            git tag -fa "$TAG" -F tag-message.md
          else
            git tag -a "$TAG" -F tag-message.md
          fi

          git push -f origin "refs/tags/$TAG"

      - name: Create or update GitHub release
        if: steps.channel.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.channel.outputs.tag }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
          VERSION: ${{ steps.channel.outputs.version }}
        run: |
          set -euo pipefail

          SHORT_SHA=$(git rev-parse --short=7 HEAD)
          mkdir -p staged

          # The built jar is only tieredechoes-<version>.jar, which makes two
          # alphas of the same version indistinguishable. Stamp the commit into
          # the alpha filename so a user can tell the downloads apart.
          if [ "$CHANNEL" = "alpha" ]; then
            ASSET="staged/tieredechoes-${VERSION}+g${SHORT_SHA}.jar"
          else
            ASSET="staged/tieredechoes-${VERSION}.jar"
          fi
          cp build/libs/tieredechoes-*.jar "$ASSET"

          PRERELEASE_FLAG=""
          if [ "$CHANNEL" != "stable" ]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          cat > release-notes.md <<EOF
          ${{ steps.changelog.outputs.body }}
          EOF

          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG already exists; updating it so a re-run is idempotent."
            gh release edit "$TAG" --notes-file release-notes.md $PRERELEASE_FLAG
            gh release upload "$TAG" "$ASSET" --clobber
          else
            gh release create "$TAG" "$ASSET" \
              --title "$TAG" \
              --notes-file release-notes.md \
              $PRERELEASE_FLAG
          fi

          echo "Published $TAG as a $CHANNEL release."

      # Hand the tag to the CurseForge workflow explicitly. GitHub refuses to
      # cascade runs started by the default GITHUB_TOKEN, so the
      # `release: published` event emitted above is ignored and CurseForge
      # publishing would otherwise never fire at all. workflow_dispatch is
      # exempt from that rule. Letting this fail is deliberate: a release that
      # silently skips the store is worse than a visibly red run.
      - name: Dispatch CurseForge publishing
        if: steps.channel.outputs.release == 'true' && steps.channel.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.channel.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Dispatching Publish to CurseForge for $TAG"
          gh workflow run "Publish to CurseForge" \
            --repo "$GITHUB_REPOSITORY" \
            --ref "$GITHUB_REF_NAME" \
            --field "tag=$TAG"

      # GitHub refuses to cascade workflow runs started by the default
      # GITHUB_TOKEN, so the "release: published" trigger only ever fires for
      # releases created by hand. Dispatch the publishing workflows directly
      # instead - they are deliberately separate from this one, so a Modrinth
      # or Packages outage never fails the release itself. The release check
      # makes this a no-op when an alpha was skipped and never tagged.
      - name: Dispatch the publishing workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          VERSION=$(grep '^mod_version=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if ! gh release view "v$VERSION" >/dev/null 2>&1; then
            echo "No release v$VERSION exists (skipped or not published); nothing to dispatch."
            exit 0
          fi

          if [ -f .github/workflows/publish.yml ]; then
            gh workflow run publish.yml
            echo "Dispatched publish.yml."
          fi
          if [ -f .github/workflows/modrinth.yml ]; then
            gh workflow run modrinth.yml -f tag="v$VERSION"
            echo "Dispatched modrinth.yml for v$VERSION."
          fi
          if [ -f .github/workflows/curseforge.yml ]; then
            gh workflow run curseforge.yml -f tag="v$VERSION"
            echo "Dispatched curseforge.yml for v$VERSION."
          fi