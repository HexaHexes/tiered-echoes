name: Publish to CurseForge

# Deliberately separate from release.yml. A CurseForge outage fails only this
# workflow and never the GitHub release.
#
# The release: published trigger is NOT sufficient on its own. GitHub refuses
# to cascade workflow runs started by the default GITHUB_TOKEN, and release.yml
# is the only thing that creates releases - so a release published by that
# token would never start this workflow. workflow_dispatch is explicitly exempt
# from that rule, so release.yml dispatches this directly after tagging.
# The release trigger is kept for releases created by hand.
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag to publish'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: curseforge-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    name: upload-file
    runs-on: ubuntu-latest

    # Edit these two lines when multi-loader support lands. Everything else
    # reads from here, so adding a loader is not a hunt through YAML.
    env:
      MINECRAFT_VERSION: '1.20.1'
      MOD_LOADERS: '["Forge"]'
      GH_TOKEN: ${{ github.token }}
      # Either the release event or the dispatch input, never both.
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

    steps:
      - name: Resolve channel from the tag
        id: channel
        run: |
          set -euo pipefail

          if [ -z "$RELEASE_TAG" ]; then
            echo "::error::No release tag supplied. Expected one from the release event or the dispatch input."
            exit 1
          fi
          echo "tag: $RELEASE_TAG"

          # Alphas are GitHub-only by decision. They are rolling builds of main
          # and publishing them would bury the channel users actually browse.
          # No pre-release suffix at all means a clean bump, which is stable.
          case "$RELEASE_TAG" in
            *+g*)
              echo "channel=alpha" >> "$GITHUB_OUTPUT"
              echo "publish=false" >> "$GITHUB_OUTPUT"
              echo "reason=alphas are published to GitHub only, not CurseForge" >> "$GITHUB_OUTPUT"
              ;;
            *-*)
              echo "channel=beta" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "reason=tag carries a pre-release suffix" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "channel=stable" >> "$GITHUB_OUTPUT"
              echo "publish=true" >> "$GITHUB_OUTPUT"
              echo "reason=clean version tag" >> "$GITHUB_OUTPUT"
              ;;
          esac

      - name: Skip alphas
        if: steps.channel.outputs.publish != 'true'
        run: |
          echo "Skipping CurseForge upload for $RELEASE_TAG."
          echo "${{ steps.channel.outputs.reason }}."

      - name: Fail if secrets are missing
        if: steps.channel.outputs.publish == 'true'
        env:
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
        run: |
          set -euo pipefail

          # Fail loudly rather than skip. A silent skip here would mean a
          # release users were promised simply never appears, with nothing in
          # the logs to explain why.
          MISSING=""
          [ -z "$CURSEFORGE_PROJECT_ID" ] && MISSING="$MISSING CURSEFORGE_PROJECT_ID"
          [ -z "$CURSEFORGE_API_KEY" ] && MISSING="$MISSING CURSEFORGE_API_KEY"

          if [ -n "$MISSING" ]; then
            echo "::error::Cannot publish a ${{ steps.channel.outputs.channel }} release to CurseForge."
            echo "::error::Missing required secret(s):$MISSING"
            echo "::error::Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

          echo "Secrets present."

      # Both the asset and the notes are read back from the published release
      # rather than taken from the event payload, so this works identically
      # whether it was triggered by the release event or by a dispatch.
      - name: Download release asset and notes
        if: steps.channel.outputs.publish == 'true'
        run: |
          set -euo pipefail
          mkdir -p staged
          gh release download "$RELEASE_TAG" \
            --pattern 'tieredechoes-*.jar' \
            --dir staged
          ls -la staged
          echo "ASSET=$(ls staged/tieredechoes-*.jar | head -1)" >> "$GITHUB_ENV"

          gh release view "$RELEASE_TAG" --json body --jq '.body' > notes.md
          echo "Release notes ($(wc -c < notes.md) bytes):"
          cat notes.md

      - name: Upload to CurseForge
        if: steps.channel.outputs.publish == 'true'
        env:
          CURSEFORGE_PROJECT_ID: ${{ secrets.CURSEFORGE_PROJECT_ID }}
          CURSEFORGE_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          CHANNEL: ${{ steps.channel.outputs.channel }}
        run: |
          set -euo pipefail

          # Map the channel onto CurseForge's three-valued release type:
          # 1 = release, 2 = beta, 3 = alpha.
          case "$CHANNEL" in
            stable) RELEASE_TYPE=1 ;;
            beta)   RELEASE_TYPE=2 ;;
            *)      RELEASE_TYPE=3 ;;
          esac

          # gameVersions carries both the Minecraft version and the loader name;
          # the API resolves loaders as game versions of the Mod Loader type.
          # A mismatch here is rejected outright, not silently accepted, so the
          # declared versions must match what the project is listed for.
          METADATA=$(jq -n \
            --rawfile changelog notes.md \
            --arg displayName "$RELEASE_TAG" \
            --arg gameVersion "$MINECRAFT_VERSION" \
            --argjson loaders "$MOD_LOADERS" \
            --argjson releaseType "$RELEASE_TYPE" \
            '{
              changelog: $changelog,
              changelogType: 1,
              displayName: $displayName,
              gameVersions: ([$gameVersion] + $loaders),
              releaseType: $releaseType
            }')

          echo "Uploading with metadata:"
          echo "$METADATA" | jq .

          RESPONSE=$(curl --silent --show-error --fail-with-body \
            --request POST \
            --header "x-api-key: $CURSEFORGE_API_KEY" \
            --form "metadata=$METADATA" \
            --form "file=@$ASSET;type=application/java-archive" \
            "https://api.curseforge.com/v1/mods/$CURSEFORGE_PROJECT_ID/file")

          echo "Upload response:"
          echo "$RESPONSE" | jq .

          ID=$(echo "$RESPONSE" | jq -r '.data.id // empty')
          if [ -z "$ID" ]; then
            echo "::error::CurseForge accepted the request but returned no file id."
            exit 1
          fi

          echo "Published CurseForge file id $ID as a $CHANNEL release."
